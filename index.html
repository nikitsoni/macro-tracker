<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Today's Fuel — Macro Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14181c;--surface:#1c2126;--surface-2:#232a30;--line:#2c343b;--text:#edeef0;--muted:#8b939b;--protein:#e8a33d;--carbs:#5fb3b3;--fat:#c77b8e;--over:#d96b5a;--good:#7fb069;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 16px 80px;}
.app{width:100%;max-width:480px;}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.top h1{font-family:'Space Grotesk',sans-serif;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:2px;}
.top-actions{display:flex;gap:8px;align-items:center;}
.btn-sm{background:none;border:1px solid var(--line);color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
.btn-sm:hover{color:var(--text);border-color:var(--text);}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;align-items:center;gap:22px;margin-bottom:18px;}
.ring-wrap{position:relative;width:104px;height:104px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:9;}
.ring-fg{fill:none;stroke:var(--good);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s,stroke .3s;}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-center .kcal-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;line-height:1;}
.ring-center .lbl{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em;}
.hero-meta .big{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:4px;}
.hero-meta .sub{font-size:12.5px;color:var(--muted);line-height:1.6;}
.hero-meta .sub b{color:var(--text);font-weight:500;}
.macros{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px 20px;margin-bottom:18px;}
.macro-row{margin-bottom:14px;}
.macro-row:last-child{margin-bottom:0;}
.macro-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.macro-name{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.macro-nums{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);}
.macro-nums b{color:var(--text);}
.bar-track{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .4s;}
.log-area{margin-bottom:18px;}
.log-row{display:flex;gap:8px;margin-bottom:8px;}
.log-row input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:12px 14px;border-radius:10px;outline:none;}
.log-row input::placeholder{color:var(--muted);}
.log-row input:focus{border-color:var(--protein);}
.log-row .log-btn{background:var(--protein);color:#1c1500;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;padding:0 18px;border-radius:10px;cursor:pointer;white-space:nowrap;}
.log-row .log-btn:disabled{opacity:.5;cursor:default;}
.log-row .log-btn:hover:not(:disabled){background:#f0b355;}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5;padding-left:2px;}
.hint span{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--carbs);}
.feed{display:flex;flex-direction:column;gap:8px;}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;}
.entry-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:42px;flex-shrink:0;}
.entry-body{flex:1;min-width:0;}
.entry-name{font-size:13.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.entry-macros span{margin-right:8px;}
.entry-macros .p{color:var(--protein);}
.entry-macros .c{color:var(--carbs);}
.entry-macros .f{color:var(--fat);}
.entry-kcal{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;flex-shrink:0;}
.entry-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;line-height:1;}
.entry-del:hover{color:var(--over);}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;border:1px dashed var(--line);border-radius:12px;line-height:1.7;}
.no-match-box{background:rgba(217,107,90,.08);border:1px solid rgba(217,107,90,.3);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:12.5px;color:#f0a396;}
.no-match-box ul{margin:6px 0 0 18px;}
.no-match-box li{margin-bottom:2px;}
.no-match-box a{color:var(--carbs);cursor:pointer;text-decoration:underline;}
.section-toggle{text-align:center;margin-top:22px;}
.section-toggle button{background:none;border:none;color:var(--muted);font-size:11.5px;text-decoration:underline;cursor:pointer;font-family:'Inter',sans-serif;}
/* Browse panel */
.browse-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;display:none;}
.browse-panel.open{display:block;}
.browse-search{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;outline:none;margin-bottom:10px;}
.browse-search::placeholder{color:var(--muted);}
.browse-search:focus{border-color:var(--carbs);}
.browse-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;}
.browse-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.browse-item:hover{background:var(--surface-2);border-color:var(--line);}
.browse-item-name{font-size:13px;}
.browse-item-srv{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
.browse-item-kcal{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--protein);}
/* Manual modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;}
.modal h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin-bottom:14px;}
.modal label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;margin-top:10px;}
.modal label:first-of-type{margin-top:0;}
.modal input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 10px;border-radius:7px;outline:none;}
.modal input:focus{border-color:var(--protein);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-save{flex:1;background:var(--protein);color:#1c1500;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;}
.modal-save:hover{background:#f0b355;}
.modal-cancel{background:none;border:1px solid var(--line);color:var(--muted);font-family:'Inter',sans-serif;font-size:13px;padding:10px 14px;border-radius:8px;cursor:pointer;}
/* Targets panel */
.targets-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;display:none;gap:10px;grid-template-columns:1fr 1fr;}
.targets-panel.open{display:grid;}
.targets-panel label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.targets-panel input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;border-radius:6px;outline:none;}
.targets-panel .save-targets{grid-column:1/-1;background:var(--protein);border:none;color:#1c1500;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;padding:8px;border-radius:6px;cursor:pointer;margin-top:4px;}
</style>
</head>
<body>
<!-- Manual entry modal -->
<div class="modal-overlay hidden" id="manualModal">
  <div class="modal">
    <h2>Add manually</h2>
    <label>Food name</label>
    <input type="text" id="mName" placeholder="e.g. Protein bar"/>
    <label>Calories (kcal)</label>
    <input type="number" id="mKcal" placeholder="200"/>
    <label>Protein (g)</label>
    <input type="number" id="mProtein" placeholder="20"/>
    <label>Carbs (g)</label>
    <input type="number" id="mCarbs" placeholder="25"/>
    <label>Fat (g)</label>
    <input type="number" id="mFat" placeholder="7"/>
    <div class="modal-actions">
      <button class="modal-save" id="mSave">Add to log</button>
      <button class="modal-cancel" id="mCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="top">
    <div>
      <h1>Today's Fuel</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="top-actions">
      <button class="btn-sm" id="manualBtn">+ Manual</button>
      <button class="btn-sm" id="resetBtn">Reset day</button>
    </div>
  </div>

  <div class="hero">
    <div class="ring-wrap">
      <svg width="104" height="104">
        <circle class="ring-bg" cx="52" cy="52" r="44"/>
        <circle class="ring-fg" id="ringFg" cx="52" cy="52" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5"/>
      </svg>
      <div class="ring-center">
        <div class="kcal-num" id="kcalNow">0</div>
        <div class="lbl">kcal</div>
      </div>
    </div>
    <div class="hero-meta">
      <div class="big" id="kcalHeadline">0 of 2,100 kcal</div>
      <div class="sub" id="kcalSub">Log your first meal to start tracking.</div>
    </div>
  </div>

  <div class="macros">
    <div class="macro-row">
      <div class="macro-top">
        <span class="macro-name" style="color:var(--protein)">Protein</span>
        <span class="macro-nums"><b id="proteinNow">0</b> / <span id="proteinTarget">130</span>g</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="proteinBar" style="width:0%;background:var(--protein)"></div></div>
    </div>
    <div class="macro-row">
      <div class="macro-top">
        <span class="macro-name" style="color:var(--carbs)">Carbs</span>
        <span class="macro-nums"><b id="carbsNow">0</b> / <span id="carbsTarget">280</span>g</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="carbsBar" style="width:0%;background:var(--carbs)"></div></div>
    </div>
    <div class="macro-row">
      <div class="macro-top">
        <span class="macro-name" style="color:var(--fat)">Fat</span>
        <span class="macro-nums"><b id="fatNow">0</b> / <span id="fatTarget">51</span>g</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="fatBar" style="width:0%;background:var(--fat)"></div></div>
    </div>
  </div>

  <div class="log-area">
    <div class="log-row">
      <input type="text" id="foodInput" placeholder="e.g. 3 eggs, 2 rotis, 150g chicken breast"/>
      <button class="log-btn" id="logBtn">Log</button>
    </div>
    <div class="hint">Separate multiple foods with commas. Use <span>2 rotis</span> <span>150g chicken</span> <span>1 bowl dal</span> <span>1 scoop whey</span></div>
  </div>

  <div id="noMatchSlot"></div>
  <div class="feed" id="feed">
    <div class="empty" id="emptyState">Nothing logged yet.<br>Type what you ate above and hit Log.</div>
  </div>

  <div class="section-toggle" style="margin-top:18px;">
    <button id="browseToggle">Browse food database</button>
    <div class="browse-panel" id="browsePanel">
      <input class="browse-search" id="browseSearch" placeholder="Search foods…"/>
      <div class="browse-list" id="browseList"></div>
    </div>
  </div>

  <div class="section-toggle">
    <button id="targetsToggle">Edit daily targets</button>
    <div class="targets-panel" id="targetsPanel">
      <div><label>Calories</label><input type="number" id="tKcal" value="2100"/></div>
      <div><label>Protein (g)</label><input type="number" id="tProtein" value="130"/></div>
      <div><label>Carbs (g)</label><input type="number" id="tCarbs" value="280"/></div>
      <div><label>Fat (g)</label><input type="number" id="tFat" value="51"/></div>
      <button class="save-targets" id="saveTargets">Save targets</button>
    </div>
  </div>
</div>

/* =========================================================
   PARSER + MATCHER
========================================================= */
const UNIT_NAMES = ['kg','g','ml','l','piece','pieces','pcs','slice','slices',
  'bowl','bowls','cup','cups','glass','glasses','plate','plates','katori',
  'tbsp','tablespoon','tablespoons','tsp','teaspoon','teaspoons',
  'scoop','scoops','handful','handfuls','serving','servings'];

function parseItem(raw){
  let text = raw.trim().toLowerCase().replace(/\bhalf\b/g,'0.5').replace(/\bhalf-\b/g,'0.5');
  let qty=1, unit=null, foodText=text;

  // "150g chicken" or "150 g chicken"
  const wm = text.match(/^([\d.]+)\s*(g|kg|ml|l)\s+(.+)$/i);
  if(wm){ qty=parseFloat(wm[1]); unit=wm[2].toLowerCase(); foodText=wm[3]; }
  else {
    const up = new RegExp('^([\\d.]+)\\s+(' + UNIT_NAMES.join('|') + ')\\s+(.+)$','i');
    const um = text.match(up);
    if(um){ qty=parseFloat(um[1]); unit=um[2].toLowerCase(); foodText=um[3]; }
    else {
      const qm = text.match(/^([\d.]+)\s+(.+)$/);
      if(qm){ qty=parseFloat(qm[1]); foodText=qm[2]; }
    }
  }

  // Normalize units
  const norm = {pieces:'piece',pcs:'piece',slices:'slice',bowls:'bowl',
    cups:'cup',glasses:'glass',plates:'plate',
    tablespoon:'tbsp',tablespoons:'tbsp',
    teaspoon:'tsp',teaspoons:'tsp',
    scoops:'scoop',handfuls:'handful',
    servings:'serving',g:'g',kg:'kg',ml:'ml',l:'l'};
  if(unit && norm[unit]) unit=norm[unit];

  return {qty, unit, foodText: foodText.replace(/\b(boiled|fried|grilled|steamed|baked|raw|cooked|fresh|roasted|scrambled|poached)\b/g,'').trim()};
}

function matchFood(foodText){
  foodText = foodText.toLowerCase().trim();
  let best=null, bestScore=0;
  for(const food of DB){
    let score=0;
    for(const kw of food.kw){
      if(foodText===kw){ score=Math.max(score,100); break; }
      if(foodText.includes(kw)){ score=Math.max(score,85); }
      else if(kw.includes(foodText)){ score=Math.max(score,75); }
      else {
        const fw=foodText.split(/\s+/), kw2=kw.split(/\s+/);
        const hits=fw.filter(w=>w.length>2&&kw2.some(k=>k.includes(w)||w.includes(k))).length;
        if(hits>0) score=Math.max(score,25+hits*20);
      }
    }
    if(score>bestScore){ bestScore=score; best=food; }
  }
  return bestScore>=30 ? {food:best, score:bestScore} : null;
}

function calcMacros(food, qty, unit){
  let grams;
  if(!unit){ unit=food.srv.default; }
  if(unit==='g'){ grams=qty; }
  else if(unit==='kg'){ grams=qty*1000; }
  else if(unit==='ml'||unit==='l'){ grams=unit==='l'?qty*1000:qty; }
  else {
    const sg = food.srv[unit] || food.srv[food.srv.default] || 100;
    grams = qty * sg;
  }
  const f=grams/100;
  return {
    calories: Math.round(food.cal*f),
    protein:  Math.round(food.p*f*10)/10,
    carbs:    Math.round(food.c*f*10)/10,
    fat:      Math.round(food.f*f*10)/10,
    grams:    Math.round(grams)
  };
}

function servingLabel(food){
  const u=food.srv.default;
  const g=food.srv[u];
  return `per ${u} (~${g}g)`;
}

/* =========================================================
   APP STATE & STORAGE
========================================================= */
const RING=276.5;
function todayKey(){ return new Date().toISOString().slice(0,10); }
let targets={kcal:2100,protein:130,carbs:280,fat:51};
let entries=[];
const el=id=>document.getElementById(id);

function save(){ localStorage.setItem('macro-log-'+todayKey(),JSON.stringify(entries)); }
function load(){
  try{ const r=localStorage.getItem('macro-log-'+todayKey()); entries=r?JSON.parse(r):[]; }catch{ entries=[]; }
  try{ const t=localStorage.getItem('macro-targets'); if(t){ targets=JSON.parse(t); el('tKcal').value=targets.kcal; el('tProtein').value=targets.protein; el('tCarbs').value=targets.carbs; el('tFat').value=targets.fat; } }catch{}
  render();
}

/* =========================================================
   RENDER
========================================================= */
function totals(){ return entries.reduce((a,e)=>({kcal:a.kcal+e.calories,protein:a.protein+e.protein,carbs:a.carbs+e.carbs,fat:a.fat+e.fat}),{kcal:0,protein:0,carbs:0,fat:0}); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtT(iso){ return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}); }

function render(){
  const t=totals();
  el('kcalNow').textContent=Math.round(t.kcal);
  el('kcalHeadline').textContent=`${Math.round(t.kcal).toLocaleString()} of ${targets.kcal.toLocaleString()} kcal`;
  const pct=Math.min(t.kcal/targets.kcal,1);
  const ring=el('ringFg');
  ring.style.strokeDashoffset=RING-RING*pct;
  ring.style.stroke=t.kcal>targets.kcal?'var(--over)':'var(--good)';
  const rem=targets.kcal-t.kcal;
  el('kcalSub').innerHTML=entries.length===0?'Log your first meal to start tracking.'
    :(rem>=0?`<b>${Math.round(rem).toLocaleString()}</b> kcal remaining`:`<b>${Math.round(-rem).toLocaleString()}</b> kcal over target`);
  setMacro('protein',t.protein,targets.protein);
  setMacro('carbs',t.carbs,targets.carbs);
  setMacro('fat',t.fat,targets.fat);
  el('proteinTarget').textContent=targets.protein;
  el('carbsTarget').textContent=targets.carbs;
  el('fatTarget').textContent=targets.fat;
  renderFeed();
}

function setMacro(n,now,target){
  el(n+'Now').textContent=Math.round(now);
  el(n+'Bar').style.width=Math.min((now/target)*100,100)+'%';
  el(n+'Bar').style.background=now>target?'var(--over)':`var(--${n})`;
}

function renderFeed(){
  el('feed').querySelectorAll('.entry').forEach(n=>n.remove());
  el('emptyState').style.display=entries.length===0?'block':'none';
  [...entries].sort((a,b)=>new Date(b.loggedAt)-new Date(a.loggedAt)).forEach(e=>{
    const div=document.createElement('div');
    div.className='entry';
    div.innerHTML=`
      <div class="entry-time">${fmtT(e.loggedAt)}</div>
      <div class="entry-body">
        <div class="entry-name">${esc(e.name)}</div>
        <div class="entry-macros">
          <span class="p">P ${Math.round(e.protein)}g</span>
          <span class="c">C ${Math.round(e.carbs)}g</span>
          <span class="f">F ${Math.round(e.fat)}g</span>
        </div>
      </div>
      <div class="entry-kcal">${Math.round(e.calories)}</div>
      <button class="entry-del" data-id="${e.id}">×</button>`;
    el('feed').appendChild(div);
  });
  el('feed').querySelectorAll('.entry-del').forEach(b=>{
    b.addEventListener('click',()=>{ entries=entries.filter(e=>e.id!==b.dataset.id); save(); render(); });
  });
}

/* =========================================================
   LOG HANDLER
========================================================= */
function addEntry(name,calories,protein,carbs,fat){
  entries.push({id:'e'+Date.now()+Math.random().toString(36).slice(2,5),name,calories,protein,carbs,fat,loggedAt:new Date().toISOString()});
  save(); render();
}

function handleLog(){
  const input=el('foodInput');
  const raw=input.value.trim();
  if(!raw) return;

  const items=raw.split(',').map(s=>s.trim()).filter(Boolean);
  const unmatched=[];

  for(const item of items){
    const parsed=parseItem(item);
    const match=matchFood(parsed.foodText);
    if(match){
      const m=calcMacros(match.food,parsed.qty,parsed.unit);
      const label=`${match.food.name}${parsed.qty!==1?` ×${parsed.qty}`:''}`;
      addEntry(label,m.calories,m.protein,m.carbs,m.fat);
    } else {
      unmatched.push(item);
    }
  }

  if(unmatched.length){
    el('noMatchSlot').innerHTML=`<div class="no-match-box">
      ⚠️ Couldn't match: <ul>${unmatched.map(u=>`<li>"${esc(u)}" — <a onclick="openManualPrefilled('${esc(u)}')">add manually</a> or check the food database below</li>`).join('')}</ul>
    </div>`;
    setTimeout(()=>{ el('noMatchSlot').innerHTML=''; },12000);
  } else {
    el('noMatchSlot').innerHTML='';
  }

  input.value='';
  input.focus();
}

el('logBtn').addEventListener('click',handleLog);
el('foodInput').addEventListener('keydown',e=>{ if(e.key==='Enter') handleLog(); });
el('resetBtn').addEventListener('click',()=>{ if(confirm("Reset today's log?")){ entries=[]; save(); render(); } });

/* =========================================================
   MANUAL MODAL
========================================================= */
function openManual(){ el('manualModal').classList.remove('hidden'); el('mName').focus(); }
function openManualPrefilled(name){ openManual(); el('mName').value=name; el('mKcal').focus(); }
window.openManualPrefilled=openManualPrefilled;

el('manualBtn').addEventListener('click',openManual);
el('mCancel').addEventListener('click',()=>el('manualModal').classList.add('hidden'));
el('mSave').addEventListener('click',()=>{
  const name=el('mName').value.trim();
  const cal=parseFloat(el('mKcal').value)||0;
  const p=parseFloat(el('mProtein').value)||0;
  const c=parseFloat(el('mCarbs').value)||0;
  const f=parseFloat(el('mFat').value)||0;
  if(!name||!cal){ alert('Enter at least a name and calories.'); return; }
  addEntry(name,cal,p,c,f);
  el('manualModal').classList.add('hidden');
  ['mName','mKcal','mProtein','mCarbs','mFat'].forEach(id=>{ el(id).value=''; });
});

/* =========================================================
   BROWSE PANEL
========================================================= */
function renderBrowse(filter=''){
  const list=el('browseList');
  list.innerHTML='';
  const q=filter.toLowerCase();
  const filtered=DB.filter(f=>!q||f.name.toLowerCase().includes(q)||f.kw.some(k=>k.includes(q)));
  filtered.forEach(food=>{
    const srv=food.srv[food.srv.default];
    const macroAt100=`${Math.round(food.cal)} kcal`;
    const div=document.createElement('div');
    div.className='browse-item';
    div.innerHTML=`<div><div class="browse-item-name">${esc(food.name)}</div><div class="browse-item-srv">per ${food.srv.default} (~${srv}g) · P${food.p}g C${food.c}g F${food.f}g</div></div><div class="browse-item-kcal">${macroAt100}</div>`;
    div.addEventListener('click',()=>{
      el('foodInput').value=(el('foodInput').value?el('foodInput').value+', ':'')+'1 '+food.kw[0];
      el('foodInput').focus();
      el('browsePanel').classList.remove('open');
    });
    list.appendChild(div);
  });
  if(!filtered.length) list.innerHTML='<div style="color:var(--muted);font-size:13px;padding:10px">No foods found.</div>';
}

el('browseToggle').addEventListener('click',()=>{
  el('browsePanel').classList.toggle('open');
  if(el('browsePanel').classList.contains('open')){ renderBrowse(); el('browseSearch').focus(); }
});
el('browseSearch').addEventListener('input',()=>renderBrowse(el('browseSearch').value));

/* =========================================================
   TARGETS
========================================================= */
el('targetsToggle').addEventListener('click',()=>el('targetsPanel').classList.toggle('open'));
el('saveTargets').addEventListener('click',()=>{
  targets={kcal:Number(el('tKcal').value)||2100,protein:Number(el('tProtein').value)||130,carbs:Number(el('tCarbs').value)||280,fat:Number(el('tFat').value)||51};
  localStorage.setItem('macro-targets',JSON.stringify(targets));
  render(); el('targetsPanel').classList.remove('open');
});

/* =========================================================
   INIT
========================================================= */
el('dateLabel').textContent=new Date().toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
load();
</script>
